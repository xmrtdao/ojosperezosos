<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>OjosPerezosos — Multimodal AI Vision Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f0f;
    color: #eee;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 1rem;
  }
  h1 { font-size: 1.8rem; color: #4fc3f7; margin-bottom: 0.2rem; }
  .subtitle { color: #aaa; font-size: 0.9rem; margin-bottom: 1rem; }
  #camera-container {
    position: relative;
    width: 100%; max-width: 480px;
    aspect-ratio: 3/4;
    background: #1a1a1a;
    border: 2px dashed #444;
    border-radius: 12px;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: none; }
  #preview-img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .placeholder-text { color: #666; text-align: center; padding: 2rem; font-size: 1rem; }
  .btn {
    background: #4fc3f7;
    color: #0f0f0f;
    border: none;
    padding: 0.8rem 1.2rem;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    margin: 0.4rem;
    transition: background 0.2s;
    min-width: 120px;
  }
  .btn:hover { background: #29b6f6; }
  .btn.secondary { background: #333; color: #eee; }
  .btn.secondary:hover { background: #444; }
  #controls { margin-top: 0.8rem; display: flex; flex-wrap: wrap; justify-content: center; }
  #output {
    width: 100%; max-width: 480px;
    margin-top: 1rem;
    background: #1a1a1a;
    border-radius: 12px;
    padding: 1rem;
    display: none;
  }
  .output-label { color: #4fc3f7; font-weight: 600; margin-bottom: 0.5rem; }
  .output-text { color: #eee; line-height: 1.5; font-size: 1rem; }
  #loading {
    display: none;
    color: #4fc3f7;
    margin-top: 0.8rem;
    font-style: italic;
  }
  .sr-only { position: absolute; left: -9999px; width: 1px; height: 1px; }
  #voice-hint { color: #666; font-size: 0.8rem; margin-top: 0.5rem; text-align: center; }
  .hidden-file-input { display: none; }
</style>
</head>
<body>
  <h1 aria-label="Ojos Perezosos">OjosPerezosos</h1>
  <p class="subtitle">Your AI eyes when you need a rest</p>

  <div id="camera-container" role="region" aria-label="Camera preview">
    <p class="placeholder-text" id="placeholder">Camera off. Use buttons below.</p>
    <video id="video" autoplay playsinline aria-hidden="true"></video>
    <img id="preview-img" alt="Captured scene" />
  </div>

  <div id="controls" role="toolbar" aria-label="Action buttons">
    <button class="btn" id="btn-start" aria-label="Start camera">Start Camera</button>
    <button class="btn secondary" id="btn-describe" aria-label="Describe scene">Describe</button>
    <button class="btn secondary" id="btn-read" aria-label="Read text from image">Read Text</button>
    <button class="btn secondary" id="btn-find" aria-label="Find objects">Find Objects</button>
    <button class="btn secondary" id="btn-upload" aria-label="Upload photo">Upload</button>
    <button class="btn secondary" id="btn-reset" aria-label="Reset">Reset</button>
  </div>

  <p id="loading" role="status" aria-live="polite">Processing with vision AI...</p>

  <div id="output" role="region" aria-label="AI output">
    <div class="output-label" id="output-label">Description</div>
    <div class="output-text" id="output-text"></div>
  </div>

  <p id="voice-hint">Voice commands: "describe", "read", "find" (Chrome desktop only)</p>

  <input type="file" id="file-input" class="hidden-file-input" accept="image/*" />

<script>
const video = document.getElementById('video');
const previewImg = document.getElementById('preview-img');
const placeholder = document.getElementById('placeholder');
const btnStart = document.getElementById('btn-start');
const btnDescribe = document.getElementById('btn-describe');
const btnRead = document.getElementById('btn-read');
const btnFind = document.getElementById('btn-find');
const btnUpload = document.getElementById('btn-upload');
const btnReset = document.getElementById('btn-reset');
const loading = document.getElementById('loading');
const output = document.getElementById('output');
const outputLabel = document.getElementById('output-label');
const outputText = document.getElementById('output-text');
const fileInput = document.getElementById('file-input');

let stream = null;
let recognition = null;

// Speech synthesis for reading results aloud
function speak(text) {
  if ('speechSynthesis' in window) {
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.0;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }
}

btnStart.addEventListener('click', async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = stream;
    video.style.display = 'block';
    previewImg.style.display = 'none';
    placeholder.style.display = 'none';
  } catch (e) {
    alert('Camera access denied: ' + e.message);
  }
});

function captureImage() {
  if (!stream && previewImg.style.display !== 'block') {
    alert('Start camera or upload a photo first'); return null;
  }
  if (stream) {
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    return canvas.toDataURL('image/jpeg', 0.85);
  }
  return previewImg.src;
}

function showImage(dataUrl) {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  previewImg.src = dataUrl;
  previewImg.style.display = 'block';
  placeholder.style.display = 'none';
}

function setLoading(label) {
  output.style.display = 'none';
  loading.style.display = 'block';
  loading.textContent = label || 'Processing with vision AI...';
}

function showResult(label, text) {
  loading.style.display = 'none';
  outputLabel.textContent = label;
  outputText.textContent = text;
  output.style.display = 'block';
  speak(text);
}

// Simulated vision pipeline for demo
async function callVision(mode) {
  const dataUrl = captureImage();
  if (!dataUrl) return;
  showImage(dataUrl);

  setLoading(mode === 'describe' ? 'Describing scene...' : mode === 'read' ? 'Reading text...' : 'Finding objects...');
  await new Promise(r => setTimeout(r, 2000));

  if (mode === 'describe') {
    const captions = [
      "A cozy living room with a brown leather sofa, a wooden coffee table with magazines, and a large window letting in warm afternoon sunlight. A green potted plant sits in the corner.",
      "A kitchen counter with a stainless steel kettle, a bowl of red apples, a cutting board with a half-sliced cucumber, and a window showing a cloudy sky.",
      "A bedroom with white walls, an unmade bed with blue sheets, a nightstand with a lamp and a pair of glasses, and a closet slightly ajar showing hanging clothes."
    ];
    showResult('Scene Description', captions[Math.floor(Math.random()*captions.length)]);
  } else if (mode === 'read') {
    const texts = [
      "Welcome to The Garden Cafe. Today's specials: Truffle Mushroom Risotto $18, Grilled Salmon with Asparagus $22, Lemon Tart $9. Open 8 AM — 10 PM.",
      "NOTICE: Building maintenance scheduled for Tuesday 9 AM — 12 PM. Elevator B will be out of service. Please use Elevator A or stairs.",
      "Prescription: Amoxicillin 500mg. Take one capsule three times daily for 7 days. Take with food. Refills: 0. Dr. Sarah Chen."
    ];
    showResult('Extracted Text', texts[Math.floor(Math.random()*texts.length)]);
  } else {
    const objects = [
      "Keys — detected on the wooden table, near the front edge.\nPhone — detected on the sofa armrest, left side.\nWallet — not detected in current view.",
      "Glasses — detected on the nightstand, next to the lamp.\nWater bottle — detected on the floor near the bed.\nBook — detected partially under the pillow.",
      "Laptop — detected on the desk, center.\nCoffee mug — detected to the right of the laptop.\nHeadphones — detected hanging on the chair back."
    ];
    showResult('Object Locations', objects[Math.floor(Math.random()*objects.length)]);
  }
}

btnDescribe.addEventListener('click', () => callVision('describe'));
btnRead.addEventListener('click', () => callVision('read'));
btnFind.addEventListener('click', () => callVision('find'));

btnUpload.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => showImage(ev.target.result);
  reader.readAsDataURL(file);
});

btnReset.addEventListener('click', () => {
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  video.style.display = 'none';
  previewImg.style.display = 'none';
  placeholder.style.display = 'block';
  output.style.display = 'none';
  loading.style.display = 'none';
  window.speechSynthesis.cancel();
});

// Voice command support (Chrome)
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.continuous = true;
  recognition.interimResults = false;
  recognition.lang = 'en-US';
  recognition.onresult = (event) => {
    const transcript = event.results[event.results.length-1][0].transcript.toLowerCase().trim();
    if (transcript.includes('describe')) callVision('describe');
    else if (transcript.includes('read')) callVision('read');
    else if (transcript.includes('find')) callVision('find');
  };
  // Start listening after camera starts
  btnStart.addEventListener('click', () => {
    setTimeout(() => recognition.start(), 1000);
  });
}
</script>
</body>
</html>
