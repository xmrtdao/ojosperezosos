<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ED1C24"/>
      <stop offset="100%" stop-color="#ff4d4d"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ED1C24"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="45" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="22" font-weight="700" letter-spacing="1">OJOS PEREZOSOS</text>
  <text x="450" y="68" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="11" font-weight="500" letter-spacing="3">EYE TRACKING + DICHOPTIC TRAINING PIPELINE</text>

  <!-- Eye Input -->
  <rect x="20" y="120" width="160" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="20" y="120" width="160" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="100" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">CAMERA</text>
  <text x="100" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Webcam / IR Sensor</text>
  <circle cx="100" cy="215" r="35" stroke="#ED1C24" stroke-width="2" fill="#1a1a1a"/>
  <ellipse cx="100" cy="215" rx="28" ry="20" fill="none" stroke="#ED1C24" stroke-width="1.5" opacity="0.6"/>
  <circle cx="100" cy="215" r="10" fill="#ED1C24" opacity="0.5"/>
  <circle cx="100" cy="215" r="4" fill="#fff"/>

  <line x1="180" y1="190" x2="220" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- MediaPipe Tracking -->
  <rect x="230" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="230" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="315" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">EYE TRACKING</text>
  <text x="315" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">MediaPipe / OpenCV</text>
  <circle cx="280" cy="215" r="4" fill="#ED1C24"/>
  <circle cx="350" cy="215" r="4" fill="#ED1C24"/>
  <line x1="280" y1="215" x2="280" y2="240" stroke="#ED1C24" stroke-width="1" opacity="0.6"/>
  <line x1="350" y1="215" x2="350" y2="240" stroke="#ED1C24" stroke-width="1" opacity="0.6"/>
  <rect x="270" y="240" width="20" height="12" fill="#ED1C24" opacity="0.3" rx="2"/>
  <rect x="340" y="240" width="20" height="12" fill="#ED1C24" opacity="0.3" rx="2"/>
  <text x="315" y="223" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="8">Landmarks</text>

  <line x1="400" y1="190" x2="440" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Dichoptic Engine -->
  <rect x="450" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="450" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="535" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">DICHOPTIC ENGINE</text>
  <text x="535" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Per-eye rendering stream</text>
  <rect x="470" y="190" width="55" height="55" fill="#111" stroke="#ED1C24" stroke-width="1.5" rx="4"/>
  <text x="497" y="220" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">L</text>
  <rect x="545" y="190" width="55" height="55" fill="#111" stroke="#ED1C24" stroke-width="1.5" rx="4"/>
  <text x="572" y="220" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600">R</text>

  <line x1="620" y1="190" x2="660" y2="190" stroke="#ED1C24" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>

  <!-- Training Metrics -->
  <rect x="670" y="120" width="170" height="140" fill="url(#card)" stroke="#2a2a2a" stroke-width="1.5" rx="10"/>
  <rect x="670" y="120" width="170" height="3" fill="url(#accent)" rx="1.5"/>
  <text x="755" y="155" text-anchor="middle" fill="#ffffff" font-family="JetBrains Mono, monospace" font-size="13" font-weight="600">METRICS</text>
  <text x="755" y="172" text-anchor="middle" fill="#aaaaaa" font-family="JetBrains Mono, monospace" font-size="9">Session analytics</text>
  <polyline points="690,240 710,225 730,230 750,215 770,205 790,195 810,185" fill="none" stroke="#ED1C24" stroke-width="2"/>
  <circle cx="690" cy="240" r="3" fill="#ED1C24"/>
  <circle cx="750" cy="215" r="3" fill="#ED1C24"/>
  <circle cx="810" cy="185" r="3" fill="#ED1C24"/>

  <!-- Bottom Metrics -->
  <rect x="80" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="180" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">60 FPS</text>
  <text x="180" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">TRACKING RATE</text>

  <rect x="310" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="410" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">&lt; 20ms</text>
  <text x="410" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">LATENCY</text>

  <rect x="540" y="300" width="200" height="70" fill="#111" stroke="#2a2a2a" stroke-width="1" rx="8"/>
  <text x="640" y="330" text-anchor="middle" fill="#ED1C24" font-family="JetBrains Mono, monospace" font-size="18" font-weight="700">AMD OPT</text>
  <text x="640" y="350" text-anchor="middle" fill="#888888" font-family="JetBrains Mono, monospace" font-size="10">ROCm ACCELERATION</text>

  <!-- Footer -->
  <text x="450" y="400" text-anchor="middle" fill="#444" font-family="JetBrains Mono, monospace" font-size="9" letter-spacing="1">AMD ROCm + MI300X | XMRT DAO</text>
</svg>
